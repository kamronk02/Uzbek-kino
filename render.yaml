services:
  - type: web
    name: uzbek-kino-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: uzbek-kino-db
          property: connectionString
      - key: CHANNEL_ID
        sync: false
      - key: FORCE_SUB_CHANNELS
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEB_ADMIN_ENABLED
        value: "true"
      - key: WEB_ADMIN_USERNAME
        value: "admin"
      - key: WEB_ADMIN_PASSWORD
        sync: false

databases:
  - name: uzbek-kino-db
    plan: free
